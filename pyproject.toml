[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team_maker"
version = "0.1.0"
description = "A factory that generates standalone multi-agent team packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.0",
]
google = [
    "google-generativeai>=0.7",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.0",
    "google-generativeai>=0.7",
]
vector = [
    "chromadb>=0.5",
]
# CrewAI pin (AD-7). The floor is the version the multi-provider conformance
# test has actually been run against; the ceiling stops an unverified minor
# from being pulled in silently. Widening either bound requires
# `tests/conformance/test_multi_provider_conformance.py` to pass on the new
# version first — per-agent routing is the thing that breaks quietly.
runtime = [
    "crewai>=1.14.6,<1.15",
]
# The HTTP seam (Story 2.0, AD-4). Same pin discipline as `runtime` above.
# FastAPI floor is 0.141 because 0.140.x carried the SSE status-code and
# event-line-splitting fixes AD-13's future streaming work will depend on; the
# ceiling stops an unverified minor arriving silently, since FastAPI's narrow
# `starlette` range is the single most common install conflict in this tree —
# `starlette` and `uvicorn` are ALREADY present transitively via `mcp` from the
# crewai dependency tree, and crewai itself pins `pydantic<2.13` and
# `httpx~=0.28.1`. Widening either bound requires re-running
# `pip install -e ".[dev]" --dry-run` and confirming nothing downgrades
# starlette/httpx/anyio/pydantic, then `tests/conformance/` on the result.
# Plain `uvicorn`, not `uvicorn[standard]`: the extra's `uvloop` has no Windows
# wheel and nothing here needs it.
api = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]
all = [
    "anthropic>=0.40",
    "openai>=1.0",
    "google-generativeai>=0.7",
    "chromadb>=0.5",
    "crewai>=1.14.6,<1.15",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "anthropic>=0.40",
    "openai>=1.0",
    "crewai>=1.14.6,<1.15",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]

[project.scripts]
team-maker = "team_maker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# `api*` is load-bearing, not decorative (Story 2.0, AC 5). setuptools *finds*
# `api/` either way and then silently drops it when it does not match `include`:
# `pip install -e .` still reports success, `import api` still works from the
# repo root (cwd is on sys.path), and the package is simply absent from any
# wheel. The failure only surfaces from a different working directory.
include = ["team_maker*", "api*"]

[tool.setuptools.package-data]
"team_maker.codegen" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["team_maker", "api"]
omit = ["tests/*"]
