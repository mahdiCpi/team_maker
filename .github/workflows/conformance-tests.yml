name: Conformance Tests (Runtime)

on:
  push:
    branches: [main, epic_*, develop]
  pull_request:
    branches: [main, epic_*, develop]

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with runtime extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[runtime,dev]"

      - name: Verify conformance tests execute
        run: |
          # Task 2 replaced pytest.importorskip with explicit pytest.fail() calls,
          # so a missing/broken crewai install now fails this step directly instead
          # of skipping — no separate "did it skip" check is needed or possible to
          # implement safely with a piped grep (an earlier version of this step did
          # exactly that, and it masked real pytest failures behind grep's exit code).
          python -m pytest tests/conformance/ -v --tb=short
